name: Prepare Demo App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo repository
        uses: actions/checkout@v4

      - name: Download original project archive
        run: |
          curl -L "https://raw.githubusercontent.com/alfazpatel221b-ux/Aztec-Control-Center/main/project-full.zip" -o project-full.zip

      - name: Extract application source
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q project-full.zip -d extracted
          cp -a extracted/. .
          rm -rf extracted project-full.zip

      - name: Switch Firebase to DemoApp
        run: |
          cat > src/firebase/config.ts <<'EOF'
          export const firebaseConfig = {
            apiKey: "AIzaSyCN3hlO5PMbE5Rm1zYkXmGGkofLnI67dk",
            authDomain: "demoapp-fa3c8.firebaseapp.com",
            projectId: "demoapp-fa3c8",
            storageBucket: "demoapp-fa3c8.firebasestorage.app",
            messagingSenderId: "261618321650",
            appId: "1:261618321650:web:51d6183c5d34a34134686b",
            measurementId: "G-XWG0363XM0"
          };
          EOF

      - name: Add demo documentation
        run: |
          cat > README.md <<'EOF'
          # Aztec Control Center — Recruiter Demo

          This repository contains the recruiter-safe demo version of the Aztec Control Center application.

          ## Safety boundary

          This demo uses a separate Firebase project (`DemoApp`) and does not connect to the production Firebase project used by the original application.

          The repository is intended to showcase the application's UX, workflow design, dashboards, KPI tracking, spend management, WBR, action management, and related capabilities using demo data.
          EOF

      - name: Commit prepared demo project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare recruiter-safe demo application" || echo "No changes to commit"
          git push
